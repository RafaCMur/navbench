<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two robots, one house: A* vs RRT*</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Two robots, one house</h1>
  <p class="sub">A* and RRT* plan a route through the same rooms. Press play and watch who gets there first.</p>
</header>

<main>
  <section class="viewer">
    <div class="stage">
      <canvas id="map"></canvas>
    </div>

    <aside class="panel">
      <div>
        <div class="robots" id="robots"></div>
        <p class="result" id="result"></p>
      </div>

      <div class="controls">
        <div class="buttons">
          <button id="play" class="primary">Play</button>
          <button id="restart">Restart</button>
          <span class="speeds">
            <button data-speed="1" class="on">1×</button>
            <button data-speed="2">2×</button>
            <button data-speed="4">4×</button>
          </span>
        </div>

        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Time">

        <label class="field">
          <span>Route</span>
          <select id="scenario"></select>
        </label>

        <label class="field">
          <span>RRT* seed <b id="seed-value">0</b></span>
          <div class="seed-row">
            <input id="seed" type="range" min="0" max="29" value="0">
            <button id="dice" title="Random seed">Random</button>
          </div>
        </label>

        <label class="check"><input id="door" type="checkbox"><span>Close the short hallway after 1 s</span></label>
        <label class="check"><input id="tree" type="checkbox"><span>Show the RRT* search tree</span></label>
        <label class="check"><input id="all" type="checkbox"><span>Show all <span id="n-seeds">30</span> routes</span></label>

        <p class="keys">Space: play or pause. Left and right arrows: change seed.</p>
      </div>
    </aside>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
